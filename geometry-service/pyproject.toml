[project]
name = "mathme-geometry-service"
version = "0.1.0"
description = "Geometry service for MathMe 3D Studio: measurements, boolean operations and print-ready exports."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "trimesh>=4.4",
  "manifold3d>=3.0",
  "networkx>=3.0",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# heart slice atlas (python -m app.anatomy.build)
anatomy = [
  "scipy>=1.11",
  "shapely>=2.0",
  "rtree>=1.2",
  "pymeshfix>=0.17",
  "fast-simplification>=0.1.7",
  "matplotlib>=3.8",
  "reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.anatomy"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# long plain-English teaching text
"app/anatomy/*" = ["E501"]
"tests/test_anatomy.py" = ["E501"]

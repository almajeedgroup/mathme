[project]
name = "mathme-account-service"
version = "0.1.0"
description = "MathMe accounts, cloud projects, plans, Cashfree billing and Campus licences (Cloudflare Python Worker)."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.7"]

[project.optional-dependencies]
local = ["uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "uvicorn>=0.30"]

[dependency-groups]
# pywrangler (Cloudflare's Python Workers CLI) for `uv run pywrangler dev|deploy`
workers = ["workers-py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["account_service", "account_service.routes"]

[tool.setuptools.package-data]
account_service = ["plans.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI declares dependencies as default values
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/entry.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

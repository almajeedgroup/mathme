# Local development: `docker compose up`, then open http://localhost:5173
services:
  geometry:
    build: ./geometry-service
    ports:
      - '8000:8000'
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '5173:5173'
    environment:
      GEOMETRY_SERVICE_URL: http://geometry:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - geometry

volumes:
  web_node_modules:
